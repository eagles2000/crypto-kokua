<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lessons · Crypto Kōkua</title>
<meta name="description" content="Fifteen plain-English crypto lessons with read-aloud: keys, wallets, exchanges, cards, taxes, borrowing and Roth IRAs.">
<meta name="theme-color" content="#0b0a0f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/site.css">
<script>try{var t=localStorage.getItem('ck-theme');if(t)document.documentElement.dataset.ck=t}catch(e){}</script>
</head>
<body>
<main id="main">
<section class="hero t-lagoon"><div class="wrap">
 <span class="kicker" style="color:#ffb59c">Lessons</span><h1>Learn crypto, one lesson at a time.</h1>
 <p class="lead" style="margin-top:16px">Seventeen short lessons in plain English. Tap any card to open it, then press Listen to hear it read aloud.</p>
 <form class="ask" role="search" autocomplete="off"><input type="search" placeholder="Ask about wallets, taxes, Kraken…" aria-label="Search lessons">
<button type="button" class="mic" aria-label="Speak your question"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v4"/></svg></button>
<button class="btn pri go" type="submit">Ask</button><div class="results"></div></form>
 <div class="btns"><a class="btn pri" href="downloads/Crypto_Kokua_Starter_Guide.pdf" download>Download the free PDF guide</a></div>
</div></section>
<section class="band t-sand"><div class="wrap">
 <div class="sech"><h2>All lessons</h2><div class="filters" id="filters"></div></div>
 <div class="grid" id="grid"></div>
</div></section>
</main>
<script src="js/data.js"></script>
<script src="js/site.js"></script>
<script>{
const {$,$$}=CK;const cats=['All',...new Set(T.map(t=>t.cat))];let cur='All';
const draw=()=>{$('#grid').innerHTML=T.filter(t=>cur==='All'||t.cat===cur).map(CK.lessonCard).join('')};
$('#filters').innerHTML=cats.map(c=>`<button data-cat="${c}" aria-pressed="${c===cur}">${c}</button>`).join('');
$('#filters').addEventListener('click',e=>{const b=e.target.closest('[data-cat]');if(!b)return;cur=b.dataset.cat;$$('#filters button').forEach(x=>x.setAttribute('aria-pressed',x===b));draw()});draw();
}</script>
</body>
</html>
